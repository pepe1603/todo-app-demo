spring:
  application:
    name: todo-app
  datasource:
    url: ${URL_DATABASE_POSTGRESQL:jdbc:postgresql://localhost:5432/todoapp}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      ssl:
        enabled: ${REDIS_SSL_ENABLED:true} # Por defecto true para Upstash
  mail:
    host: ${MAIL_HOST:smtp.resend.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:resend}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true
    from: ${MAIL_FROM:onboarding@resend.dev}

server:
  port: ${PORT:9090}

app:
  jwt:
    secret: ${JWT_SECRET:your-secret-key-here}
    expiration: ${JWT_ACCESS_TOKEN_EXPIRATION:900000}
  otp:
    length: 6
    expiration-minutes: 5
    max-attempts: 3
  cors:
    origins: ${CORS_ORIGINS:}

springdoc:
  api-docs:
    enabled: ${SPRINGDOC_ENABLED:true}
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html